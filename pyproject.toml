[project]
name = "streamgrabber"
version = "0.1.0"
description = "Capture HLS/DASH streams from web pages and download them with preserved headers"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Enki013", email = "enessalman1300@gmail.com" },
]
requires-python = ">=3.11"
keywords = [
  "hls", "m3u8", "dash", "stream", "downloader",
  "playwright", "imdb", "streamlink", "yt-dlp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Multimedia :: Video",
  "Topic :: Utilities",
]
dependencies = [
  "ffsubsync>=0.5.0",
  "m3u8>=6.0.0",
  "platformdirs>=4.3.6",
  "playwright>=1.49.0",
  "rich>=13.9.4",
  "typer>=0.15.1",
]

[project.urls]
"Homepage" = "https://github.com/Enki013/streamgrabber"
"Source" = "https://github.com/Enki013/streamgrabber"
"Bug Tracker" = "https://github.com/Enki013/streamgrabber/issues"

[project.scripts]
streamgrabber = "streamgrabber.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streamgrabber"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
